# Local end-to-end config: real workerd runtime, local bindings, mock Anthropic API.
name = "prime-acre-chat-e2e"
main = "../src/index.js"
compatibility_date = "2026-09-30"

[vars]
ANTHROPIC_API_KEY = "test-key"
ANTHROPIC_BASE_URL = "http://127.0.0.1:8788"
ALLOW_LOCALHOST = "true"
LEAD_TO = "owner@example.com"
LEAD_FROM = "assistant@primeacrehomebuyers.com"

[[kv_namespaces]]
binding = "LEADS"
id = "e2e-leads"

[[send_email]]
name = "SEND_EMAIL"

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
