# Prime Acre Capital website assistant.
# Deploy through the GitHub Action (.github/workflows/chat-worker.yml) or the dashboard paste
# (README, Path A). Don't run a plain `npx wrangler deploy` with this file: it uploads no lead
# storage or email binding and removes the ones the Action or the dashboard added.
# The only required setting is the secret ANTHROPIC_API_KEY.
name = "prime-acre-chat"
main = "src/index.js"
compatibility_date = "2026-09-30"

# Serve at chat.primeacrehomebuyers.com (Cloudflare creates the DNS record and certificate).
routes = [
  { pattern = "chat.primeacrehomebuyers.com", custom_domain = true }
]

[vars]
MODEL = "claude-opus-5-5"
EFFORT = "low"
BUSINESS_TZ = "America/Chicago"
BUSINESS_DAYS = "1,2,3,4,5,6"      # 1 = Monday ... 7 = Sunday
BUSINESS_START = "09:00"
BUSINESS_END = "19:00"
SLOT_MINUTES = "30"
MIN_NOTICE_MINUTES = "60"
DAYS_AHEAD = "7"
LEAD_TO = "brsmith6758@gmail.com"
LEAD_FROM = "assistant@primeacrehomebuyers.com"

# Lead storage (stores every lead, prevents double-booking): the GitHub Action finds or creates
# the KV namespace titled "prime-acre-chat-leads" and adds the LEADS binding at deploy time.
# Leave this commented out; the Action skips its own step if you add one here.
# [[kv_namespaces]]
# binding = "LEADS"
# id = "ID_OF_prime-acre-chat-leads"

# Optional: emails each lead to LEAD_TO through Cloudflare Email Routing.
# Requires Email Routing enabled on the zone with LEAD_TO verified as a destination.
# [[send_email]]
# name = "SEND_EMAIL"
# destination_address = "brsmith6758@gmail.com"

# Rate limits: 20 messages a minute per visitor, 300 a minute across the whole site.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

# Keep the Worker's logs (API key problems, failed emails) viewable in the dashboard.
[observability]
enabled = true
