name: Publish site to GitHub Pages

# Publishes the contents of site/ to the gh-pages branch, which GitHub Pages serves.
# No repository settings are required: GitHub enables Pages automatically for a public
# repo that has a gh-pages branch.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The chat bubble's guided mode decides how stop requests and texting consent are read;
      # its phrase checks must pass before the site goes live.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the chat bubble
        working-directory: worker
        run: |
          npm ci
          node --test --import ./test/register-stubs.mjs test/chat-phrases.test.mjs
      - name: Push site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
