name: Publish site to GitHub Pages

# Publishes the contents of site/ to the gh-pages branch, which GitHub Pages serves.
# No repository settings are required: GitHub enables Pages automatically for a public
# repo that has a gh-pages branch.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
