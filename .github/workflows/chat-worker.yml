name: Deploy chat assistant (Cloudflare Worker)

# Deploys worker/ to Cloudflare as "prime-acre-chat" at chat.primeacrehomebuyers.com.
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard's Workers & Pages overview
#   ANTHROPIC_API_KEY      from console.anthropic.com
# Until they exist, this workflow skips without failing.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["worker/**", ".github/workflows/chat-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for secrets
        id: gate
        working-directory: .   # runs before checkout, when worker/ does not exist yet
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Chat assistant not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install and test
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm ci || npm install --no-audit --no-fund
          npm test

      - name: Lead storage (KV namespace)
        if: steps.gate.outputs.ready == 'true'
        run: |
          TITLE="prime-acre-chat-leads"
          find_id() { npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.search(/^\[/m)));const n=a.find(x=>x.title===process.argv[1]);process.stdout.write(n?n.id:"")}catch{}})' "$TITLE"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create "$TITLE" || true
            ID=$(find_id)
          fi
          if [ -n "$ID" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "LEADS"\nid = "%s"\n' "$ID" >> wrangler.toml
            echo "Using KV namespace $ID"
          else
            echo "::warning::Could not create the KV namespace; deploying without lead storage."
          fi

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          cp wrangler.toml wrangler.base.toml
          printf '\n[[ratelimits]]\nname = "CHAT_LIMITER"\nnamespace_id = "1001"\nsimple = { limit = 20, period = 60 }\n' >> wrangler.toml
          if [ "${{ vars.EMAIL_BINDING }}" = "true" ]; then
            printf '\n[[send_email]]\nname = "SEND_EMAIL"\ndestination_address = "brsmith6758@gmail.com"\n' >> wrangler.toml
          fi
          if ! npx wrangler deploy; then
            echo "::warning::Deploy with the rate limiter failed; retrying without it."
            cp wrangler.base.toml wrangler.toml
            if [ "${{ vars.EMAIL_BINDING }}" = "true" ]; then
              printf '\n[[send_email]]\nname = "SEND_EMAIL"\ndestination_address = "brsmith6758@gmail.com"\n' >> wrangler.toml
            fi
            npx wrangler deploy
          fi
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY

      - name: Check it answers
        if: steps.gate.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://chat.primeacrehomebuyers.com/health; then echo; exit 0; fi
            sleep 20
          done
          echo "::warning::chat.primeacrehomebuyers.com is not answering yet; the custom domain can take a few minutes to appear."
